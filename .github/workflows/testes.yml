name: testes

on:
  push:
    branches: [main]
    paths-ignore: ["acervo/**", "COBERTURA.md"]
  pull_request:
    paths-ignore: ["acervo/**", "COBERTURA.md"]

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Fonte DejaVu (exportação em PDF no Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-dejavu-core
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[testes]"
      - name: Testes (sem rede)
        run: python -m pytest -q
