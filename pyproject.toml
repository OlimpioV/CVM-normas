[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repositorio-cvm"
version = "1.0.0"
description = "Coleta, armazenamento, consulta e atualização do acervo normativo da CVM, com rastreabilidade das fontes"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-ACERVO", "NOTICE", "CREDITOS.md"]
authors = [{ name = "OlimpioV" }]
requires-python = ">=3.12"
keywords = ["cvm", "legislação", "normas", "mercado de capitais", "compliance", "brasil"]
classifiers = [
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
# Versões exatas e testadas em requirements.txt; aqui, só os mínimos.
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "defusedxml>=0.7",
    "markdown-it-py>=3",
    "MarkupSafe>=2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "fpdf2>=2.8",
    "fastapi>=0.110",
    "Jinja2>=3.1",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
testes = ["pytest>=8", "httpx>=0.27", "PyYAML>=6"]

[project.urls]
"Código" = "https://github.com/OlimpioV/CVM-normas"
"Problemas" = "https://github.com/OlimpioV/CVM-normas/issues"

[project.scripts]
repositorio-cvm = "repositorio_cvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repositorio_cvm.web" = ["modelos/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not rede'"
markers = ["rede: testes que acessam as fontes oficiais pela internet"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
